# Config file for the Stardew-Style HUD mod for Harvest Moon 64: Recompiled.

# Fields that end up in the mod's manifest.
[manifest]

# Unique ID of this mod.
id = "hm64_stardew_hud"

# Version of this mod.
version = "0.1.0"

# The name that will show up for this mod in the mod menu.
display_name = "Stardew-Style HUD"

# The description that will show up when this mod is displayed in the mod menu.
description = """
Adds an always-on HUD in the style of Stardew Valley: a clock panel with the day, date, season, \
weather and time in the top-right corner, a gold counter beneath it, and health and energy bars \
in the bottom-right corner.

E (energy) is your stamina: tools stop working when it runs out. It grows as your maximum stamina increases.

H (health) drains when you use tools at night or in rain or snow. It turns yellow, then red, as you \
overwork; if it empties, you wake up sick the next morning. Sleep early and eat to recover.

The HUD hides itself in menus, cutscenes, and on the title screen."""

# A short description for the mod list.
short_description = "Clock, gold, health, and energy like Stardew Valley."

# Authors of this mod.
authors = [ "Grant Lemoine" ]

# ID of the target recomp game.
game_id = "hm64"

# Minimum version of the target recomp that this mod can run on.
minimum_recomp_version = "1.0.0"

dependencies = [ ]
optional_dependencies = [ ]
native_libraries = [ ]

# Inputs to the mod tool.
[inputs]
elf_path = "build/mod.elf"
mod_filename = "hm64_stardew_hud"
func_reference_syms_file = "HarvestMoon64RecompSyms/hm64.us.syms.toml"
data_reference_syms_files = [ "HarvestMoon64RecompSyms/hm64.us.datasyms.toml" ]
additional_files = [ ]

# Enum options are read back as their index, so keep "On" first.
[[manifest.config_options]]
id = "hud_enabled"
name = "Show HUD"
description = "Show or hide the Stardew-style HUD."
type = "Enum"
options = [ "On", "Off" ]
default = "On"

[[manifest.config_options]]
id = "show_health"
name = "Show Health Bar"
description = "Show the health bar (H). It shows HM64's hidden fatigue: it drains when you work at night or in bad weather, and if it empties you'll be sick the next day."
type = "Enum"
options = [ "On", "Off" ]
default = "On"

[[manifest.config_options]]
id = "hud_scale"
name = "HUD Scale"
description = "Scale the size of the HUD."
type = "Number"
min = 0.50
max = 2.00
step = 0.05
precision = 2
default = 1.0
